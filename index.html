<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#EEF1F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141A22" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="chant time">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<script>
// 万一プログラムが止まったときに、原因を画面に表示する（不具合の調査用）
window.addEventListener("error", e => {
  try {
    const d = document.createElement("div");
    d.style.cssText = "position:fixed;left:8px;right:8px;bottom:8px;z-index:999;background:#C62828;color:#fff;font:12px/1.4 sans-serif;padding:8px 10px;border-radius:8px";
    d.textContent = "Error: " + (e.message || "") + " (" + (e.lineno || "") + ":" + (e.colno || "") + ")";
    (document.body || document.documentElement).appendChild(d);
  } catch(_) {}
});
</script>
<title>chant time</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --paper:#EEF1F4; --sheet:#FFFFFF; --ink:#1D2A3A; --sub:#5F6B7A; --rule:#D5DBE2;
  --done:#1F6FC5; --done-soft:#E3EEFB; --now:#FFF6DA; --minus:#C62828; --plus:#1F6FC5;
  --sat:#2D5EA8; --sun:#B03A3A;
  --c-blue:#1F6FC5; --tcolor:#1F4E6B; --goal:#1F6FC5; --c-yellow:#D4A21A; --c-red:#C62828;
  --fill:#1F6F78; --fill-soft:#D6E9EA; --empty:#E3E6EA;
  --bg-low:#E4E6E9; --bg-b:#D2E3FA; --bg-y:#FBEEBE; --bg-r:#F8D2D0;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#141A22; --sheet:#1C242F; --ink:#E6EBF1; --sub:#9AA6B4; --rule:#2C3643;
  --done:#5EA2EE; --done-soft:#1D3450; --now:#3A3420; --minus:#F08A8A; --plus:#7FB2F0;
  --sat:#86A9E6; --sun:#EB8C8C;
  --fill:#5DB7BF; --fill-soft:#1E3A3E; --empty:#2A323D;
  --bg-low:#2E333A; --bg-b:#1E3A5F; --bg-y:#4A3E14; --bg-r:#5A2222; --goal:#7FB2F0; --tcolor:#6FA9C9;}}
*,*::before,*::after{box-sizing:inherit}
html{-webkit-text-size-adjust:100%;touch-action:manipulation}
button,select,.slot{touch-action:manipulation}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  font-size:15px;line-height:1.45}
/* iPhone の画面上部（時計・電池の表示の下）に、スクロールした内容が透けて見えないようにする */
body::before{content:"";position:fixed;left:0;right:0;top:0;height:env(safe-area-inset-top,0px);background:var(--paper);z-index:20}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none !important}
.wrap{max-width:520px;margin:0 auto;padding:0 12px calc(16px + env(safe-area-inset-bottom,0px))}
/* タブ（Daily／Period／Summary）と言語の切り替え */
.tabs{display:flex;gap:6px;margin:8px 0 8px;align-items:stretch}
.tabs button{flex:1;font:inherit;font-size:15px;font-weight:600;color:var(--sub);background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:7px 0}
.tabs button.on{color:var(--paper);background:var(--ink);border-color:var(--ink)}
.tabs button.lang{flex:0 0 auto;font-size:12px;padding:7px 8px}
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;overflow:hidden}
.panel{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:8px 12px;margin-bottom:8px}
/* ボタン（今日・バックアップ・復元・更新）：iPhone で位置がずれないよう、画面に固定しない */
.btns{display:flex;gap:8px;justify-content:center;margin:0 0 8px}
.btns button{font:inherit;font-size:14px;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:18px;padding:6px 14px}
.btns button.main{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:600}
select:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--fill);outline-offset:2px}
.note{font-size:12px;color:var(--sub);text-align:center;margin:12px 0 0}

/* ===== Daily ===== */
.head{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding:0 0 8px}
.date{display:flex;align-items:center;justify-content:space-between;padding:6px 6px;border-bottom:1px solid var(--rule)}
.date .dt{margin:0;font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;font-weight:600;font-size:22px;
  letter-spacing:.02em;text-align:center;flex:1}
.date .dt small{font-size:16px;margin-left:6px}
.date .w5{color:var(--sat)} .date .w6{color:var(--sun)}
.nav{border:0;background:transparent;color:var(--ink);font-size:20px;width:44px;height:40px;border-radius:8px}
.nav:active{background:var(--paper)}
.sum{display:grid;grid-template-columns:4.2em 3.2em 2.2em minmax(0,1fr) auto;align-items:center;gap:0 6px;padding:6px 12px}
.sum > *{padding:3px 0}
.sum .lb{font-weight:700;white-space:nowrap}
.sum .copy{justify-self:end;font:inherit;font-size:13px;font-weight:600;color:#8A6A00;background:#FFF3C4;border:0;border-radius:14px;padding:4px 12px;white-space:nowrap}
.sum .done-row{color:var(--done);font-weight:700}
.sum .urow{grid-column:1 / -1;display:flex;align-items:center;gap:6px}
.sum .urow .lb{margin-right:2px}
.sum .chants{margin-left:auto;text-align:right;font-weight:700;font-size:13px;color:var(--done);white-space:nowrap}
.sum .chants small{font-weight:500;font-size:12px;color:var(--sub)}
.sum .gv,.sum .val{font-size:17px;font-weight:700;text-align:center}
.sum select{font:inherit;font-size:16px;font-weight:700;color:var(--ink);background:var(--paper);
  border:1px solid var(--rule);border-radius:6px;padding:2px 4px;text-align:center;text-align-last:center;
  -webkit-appearance:none;appearance:none;width:3.4em}
.sum .min{text-align:center;color:var(--sub)}
.sum .min.done-row{color:var(--done)}
.sum .diff{font-weight:700;min-width:3.2em;text-align:right;white-space:nowrap}
.sum .diff .emo{font-size:20px;line-height:1;vertical-align:-3px}
.sum .diff.plus,.sum .diff.zero{font-size:14px;letter-spacing:-.02em}
.diff.minus{color:var(--minus)} .diff.plus{color:var(--plus)} .diff.zero{color:var(--sub)}
.dbar{height:6px;background:var(--rule)}
.dbar i{display:block;height:100%;width:0;background:var(--done);transition:width .3s}
.list{margin:0;padding:0}
.hdr{display:grid;grid-template-columns:1fr 1.2em 1fr 76px 64px;font-size:12px;color:var(--sub);padding:6px 12px 4px;text-align:center;align-items:end}
.hdr b{font-weight:700;color:var(--ink)} .hdr .ok{color:#A07800} .hdr .over{color:var(--minus)}
.slot{display:grid;grid-template-columns:1fr 1.2em 1fr 76px 64px;align-items:stretch;text-align:center;
  width:100%;min-height:44px;padding:0 12px;border-top:1px solid var(--rule);background:var(--sheet);font-size:16px}
.slot > span{align-self:center}
.slot .t{color:var(--sub)}
.slot.now{background:var(--now)}
.cell{display:flex;align-items:center;justify-content:center;border:0;background:transparent;padding:0;margin:0;
  cursor:pointer;-webkit-tap-highlight-color:transparent;font:inherit}
.cell:active{background:var(--paper)}
.dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--sub);opacity:.6}
.cell.on .dot{border:0;opacity:1}
.cell.r.on .dot{background:radial-gradient(circle at 35% 30%,#8CC3FF,var(--done) 60%,#0F4C99)}
.cell.t.on .dot{background:radial-gradient(circle at 35% 30%,#FFF3A6,#F2C300 60%,#B88A00)}
.cell.part .dot{opacity:1;border-style:dashed}
.cell.r.part .dot{border-color:var(--done)} .cell.t.part .dot{border-color:#D9A800}
.cell:focus-visible{outline:2px solid var(--done);outline-offset:-2px}
/* 目標時間（曜日ごと）*/
.plan-card{padding:8px 10px;margin-bottom:8px}
.plan-h{font-size:12px;color:var(--sub)}
.plan{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;margin-top:2px}
.plan label{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--sub);white-space:nowrap}
.plan label.sa{color:var(--sat)} .plan label.su{color:var(--sun)}
.plan select{font:inherit;font-size:16px;color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:6px;
  padding:4px 0;width:100%;text-align:center;text-align-last:center;-webkit-appearance:none;appearance:none}
.plan label.today{font-weight:700;color:var(--done)}
.plan label.today select{border-color:var(--done)}

/* ===== Period ===== */
/* 期間名：見た目は小さめの文字。iPhone で拡大されないよう、16px の select を透明にして上に重ねる */
.psel{position:relative;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--ink);background:var(--paper);
  border:1px solid var(--rule);border-radius:8px;padding:5px 8px;margin-bottom:10px}
.psel span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.psel i{font-style:normal;font-size:11px;color:var(--sub)}
#periodSel{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px;border:0;-webkit-appearance:none;appearance:none}
.prow{display:flex;gap:6px;align-items:center;justify-content:flex-end;margin-bottom:6px}
.prow button{font:inherit;font-size:13px;border:1px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:16px;padding:5px 10px;white-space:nowrap}
.psum{margin-right:auto;min-width:0;font-size:12px;color:var(--sub);line-height:1.35}
.psum b{color:var(--ink)}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:6px 8px;margin:0}
.facts div{display:flex;align-items:baseline;gap:4px;min-width:0}
.facts .wide{grid-column:1/-1}
.facts .trio{justify-content:space-between;gap:8px}
.facts .trio span{display:flex;align-items:baseline;gap:4px}
.facts .dcell{flex-direction:column;align-items:stretch;gap:1px}
.facts .dcell dt{font-size:12px}
.facts dt{color:var(--sub);font-size:13px;white-space:nowrap}
.facts dd{margin:0;font-weight:600;flex:1;min-width:0;white-space:nowrap}
.facts input[type=date]{font:inherit;font-size:16px;font-weight:500;color:var(--ink);background:var(--paper);
  border:1px solid var(--rule);border-radius:6px;padding:0 3px;min-height:28px;width:100%;min-width:0;letter-spacing:-.02em}
.tsel{display:flex;align-items:center;gap:4px;flex-wrap:nowrap;white-space:nowrap}
.tsel select{width:auto;min-width:7.6em;font:inherit;font-size:16px;font-weight:600;color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:2px 2px}
.gauge-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 8px}
.gauge-head b{font-size:22px;font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;font-weight:600}
.gauge-head b small{font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;font-size:14px;font-weight:600}
.gauge-head .pct{margin-left:auto;font-size:18px;font-weight:700;color:var(--ink)}
.gauge-head .allp{font-size:13px;color:var(--sub);white-space:nowrap}
.gauge-head .allp b{font-family:inherit;font-size:15px;font-weight:700;color:var(--ink)}
.gauge-sub{display:flex;flex-wrap:wrap;gap:0 14px;font-size:13px;color:var(--sub);margin-top:1px}
.gauge-sub b{color:var(--ink);font-weight:600}
.goal{font-size:14px;font-weight:600;color:var(--goal);margin-top:2px}
.bars{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:4px 8px;margin:6px 0 0}
.bl{font-size:11px;color:var(--sub);white-space:nowrap}
.track{position:relative;display:flex;gap:0;height:18px}
.seg{position:relative;height:100%;background:var(--empty);overflow:hidden}
.seg.s1{border-radius:3px 0 0 3px} .seg.s4{border-radius:0 3px 3px 0}
.seg i{position:absolute;inset:0 auto 0 0;width:0;transition:width .5s ease-out}
.seg.s1 i{background:var(--c-blue)} .seg.s2 i{background:var(--c-yellow)} .seg.s3 i{background:var(--c-red)}
.seg.s4 i{background:linear-gradient(135deg,#F4DC8A,#C99A2E 55%,#E9C865)}
.seg b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;
  text-shadow:0 0 2px rgba(120,80,0,.8);opacity:0;transition:opacity .4s}
.seg.done b{opacity:1}
.tbar{height:14px}
.tbar div{position:relative;height:100%;background:var(--empty);border-radius:3px;overflow:hidden}
.tbar i{position:absolute;inset:0 auto 0 0;width:0;background:var(--tcolor);border-radius:3px;transition:width .5s ease-out}
.scale{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);margin-top:-2px}
.tc-h{font-size:12px;color:var(--sub);margin-top:10px}
.tc{display:grid;grid-template-columns:repeat(6,1fr);row-gap:2px;margin-top:2px;text-align:center}
.tc span{font-size:12px;color:var(--sub);padding-top:2px}
.tc b{font-size:16px;font-weight:600;padding-bottom:4px;border-bottom:1px solid var(--rule)}
.tc b.z{color:var(--sub);font-weight:400}
.wk{margin-top:4px}
.wkg{display:grid;column-gap:3px;align-items:baseline;text-align:center}
.wk span{font-size:12px;color:var(--sub);padding:2px 0}
.wk .sa{color:var(--sat)} .wk .su{color:var(--sun)}
.wk b{font-size:clamp(12px,3.9vw,16px);font-weight:700;white-space:nowrap;letter-spacing:-.02em;padding:2px 0 4px;border-bottom:1px solid var(--rule)}
.wk b.z{color:var(--sub);font-weight:400}
.wk i{font-style:normal;font-size:clamp(10px,3.2vw,13px);color:var(--sub);white-space:nowrap;letter-spacing:-.02em;padding:2px 0}
.tablebox{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;overflow:clip}
table{width:100%;border-collapse:collapse;background:var(--sheet)}
thead th{position:sticky;top:env(safe-area-inset-top,0px);z-index:2;background:var(--sheet);font-size:12px;font-weight:500;color:var(--sub);
  text-align:right;padding:5px 8px;border-bottom:1px solid var(--rule)}
thead th:first-child{text-align:left}
td{padding:2px 8px;border-bottom:1px solid var(--rule);text-align:right;height:34px}
td:first-child{text-align:left;white-space:nowrap}
tbody tr.d{cursor:pointer;-webkit-tap-highlight-color:transparent}
tbody tr.d:active td{background:var(--paper)}
tr.today td{background:var(--fill-soft)}
tr.month td{height:auto;padding:4px 8px;font-size:13px;text-align:left;font-weight:600;border-bottom:1px solid var(--rule);background:var(--paper)}
.dw{font-size:12px;color:var(--sub);margin-left:3px}
.w5 .dw{color:var(--sat)} .w6 .dw,.hol .dw{color:var(--sun)}
td.tm{color:var(--ink)} td.tm.z{color:var(--sub)}
.tot{color:var(--sub)}
td.tot.low{background:var(--bg-low)} td.tot.ob{background:var(--bg-b);color:var(--ink)}
td.tot.oy{background:var(--bg-y);color:var(--ink)} td.tot.or{background:var(--bg-r);color:var(--ink)}
.mrow{display:flex;align-items:center;justify-content:space-between;gap:6px}
.legend{display:flex;gap:6px;font-size:11px;font-weight:400;color:var(--sub);white-space:nowrap}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:3px;vertical-align:-1px;background:var(--sw)}
.hint{font-size:12px;color:var(--sub);text-align:center;margin:0 0 6px}

/* ===== Summary ===== */
.yrange{display:flex;align-items:center;justify-content:space-between;gap:4px;flex-wrap:nowrap}
.yrange span{display:flex;align-items:baseline;gap:2px;white-space:nowrap}
.yrange small{font-size:12px;color:var(--sub);margin:0 3px 0 1px}
.yrange select{font:inherit;font-size:16px;font-weight:600;color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:2px 0;text-align:center;text-align-last:center;-webkit-appearance:none;appearance:none}
.yrange input[type=date]{flex:1;min-width:0;width:100%;font:inherit;font-size:16px;font-weight:600;color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:0 3px;min-height:32px;letter-spacing:-.02em}
.yrange .sep{color:var(--sub)}
.yspan{font-size:12px;color:var(--sub);text-align:center;margin-top:6px}
.tz{display:grid;grid-template-columns:repeat(4,1fr);text-align:center;row-gap:2px;margin-top:4px}
.tz span{font-size:12px;color:var(--sub)}
.tz b{font-size:18px;font-weight:700}
.tz b.z{color:var(--sub);font-weight:400}
.yitem{padding:6px 0;border-top:1px solid var(--rule)}
.yitem:first-child{border-top:0}
.yitem .l1{display:block;font-size:14px;font-weight:600}
.yitem .l2{display:block;font-size:12px;color:var(--sub)}
.yitem .l2 b{color:var(--ink)}
.ynone{font-size:13px;color:var(--sub)}

/* ===== 初回のパスワード入力・使用期限・ご利用にあたって ===== */
.gate{position:fixed;inset:0;z-index:100;background:var(--paper);overflow:auto;-webkit-overflow-scrolling:touch;
  padding:calc(20px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px))}
.gbox{max-width:480px;margin:0 auto;background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:16px}
.gbox h2{font-size:18px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.gbox h2 button{font:inherit;font-size:12px;font-weight:600;border:1px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:12px;padding:3px 10px}
.gbox ul,.notice ul{margin:0;padding-left:1.2em;font-size:13px;line-height:1.6;color:var(--ink)}
.gbox li,.notice li{margin:4px 0}
.ghint{font-size:12px;color:var(--sub);margin:10px 0}
.glab{display:block;font-size:13px;color:var(--sub);margin-top:10px}
.glab input{display:block;width:100%;margin-top:4px;font:inherit;font-size:16px;color:var(--ink);background:var(--paper);
  border:1px solid var(--rule);border-radius:8px;padding:8px 10px}
#gBtn{display:block;width:100%;margin-top:12px;font:inherit;font-size:16px;font-weight:700;color:#fff;background:#1D2A3A;border:0;border-radius:10px;padding:10px}
#gBtn:disabled{opacity:.4}
.gerr{color:#C62828;font-size:13px;min-height:1.2em;margin:8px 0 0}
body.locked{overflow:hidden}
.expired{position:fixed;inset:0;z-index:110;background:var(--paper);display:flex;align-items:center;justify-content:center;padding:24px}
.expired .gbox{text-align:center}
.expired p{font-size:15px;margin:0 0 8px}
.expired small{display:block;font-size:12px;color:var(--sub);margin-bottom:14px}
.expired button{font:inherit;font-size:16px;font-weight:700;color:#fff;background:#1D2A3A;border:0;border-radius:10px;padding:10px 24px}
.notice{max-width:520px;margin:10px auto 0;font-size:12px;color:var(--sub)}
.notice summary{cursor:pointer;text-align:center;color:#E07A10;font-weight:600}
.notice ul{color:var(--sub);font-size:12px;margin-top:6px}
.notice.bk{margin-top:4px}
.notice.bk summary{color:var(--ink)}
.snap{margin:8px 0 0;font-size:12px;color:var(--sub);text-align:center}
.snap button{font:inherit;font-size:13px;margin-left:6px;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:14px;padding:3px 10px}
@media (prefers-reduced-motion:reduce){.dbar i,.seg i,.seg b,.tbar i{transition:none}}
</style>
</head>
<body>
<div id="expired" class="expired" hidden><div class="gbox"><p id="xMsg"></p><small id="xSub"></small><button id="xBtn"></button></div></div>
<div id="gate" class="gate" hidden><div class="gbox">
  <h2><span id="gTitle"></span><button class="langBtn" data-i="langBtn"></button></h2><ul id="gList"></ul><p class="ghint" id="gHint"></p>
  <label class="glab"><span id="gLabel"></span><input id="gPass" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"></label>
  <button id="gBtn"></button><p class="gerr" id="gErr" role="alert"></p>
</div></div>
<div class="wrap">
  <div class="tabs" role="tablist"><button id="tabD" class="on" role="tab">Daily</button><button id="tabP" role="tab">Period</button><button id="tabS" role="tab">Summary</button><button class="lang langBtn" data-i="langBtn"></button></div>

  <!-- ===== Daily ===== -->
  <div id="viewD">

// ---- 日本の祝日（自動計算）----
const holCache = {};
function holidaysOf(y){
  if (holCache[y]) return holCache[y];
  const h = {};
  const add = (m,d) => { h[y+"-"+pad(m)+"-"+pad(d)] = 1; };
  const nthMon = (m,n) => { const f = new Date(y,m-1,1).getDay(); return 1 + ((8-f)%7) + (n-1)*7; };
  add(1,1); add(1,nthMon(1,2)); add(2,11); add(2,23);
  add(3,Math.floor(20.8431+0.242194*(y-1980)-Math.floor((y-1980)/4)));
  add(4,29); add(5,3); add(5,4); add(5,5); add(7,nthMon(7,3)); add(8,11); add(9,nthMon(9,3));
  add(9,Math.floor(23.2488+0.242194*(y-1980)-Math.floor((y-1980)/4)));
  add(10,nthMon(10,2)); add(11,3); add(11,23);
  Object.keys(h).forEach(k => { const d = parse(k); d.setDate(d.getDate()+2);
    if (h[iso(d)]) { const mid = parse(k); mid.setDate(mid.getDate()+1);
      if (!h[iso(mid)] && mid.getDay() !== 0) h[iso(mid)] = 1; } });
  Object.keys(h).sort().forEach(k => { const d = parse(k); if (d.getDay() === 0) {
    do { d.setDate(d.getDate()+1); } while (h[iso(d)]); h[iso(d)] = 1; } });
  return holCache[y] = h;
}
const isHoliday = s => !!holidaysOf(Number(s.slice(0,4)))[s];

const B = 5;

  if (o.weh != null) { o.sat = o.sun = o.hol = o.weh; delete o.weh; }
  WKS.forEach(k => o[k] = fitPlan(Number(o[k]))); Object.keys(o).forEach(k => { if (!WKS.includes(k)) delete o[k]; }); return o; };
const newPeriod = (o = {}) => ({ start: o.start || CFG.start, end: o.end || CFG.end,
  target: o.target || (o.targetMan ? o.targetMan * 10000 : CFG.target), plan: cleanPlan(o.plan) });
function migrateDays(days){             // 旧版（20分ごとの on）からの変換
  const out = {};
  Object.entries(days || {}).forEach(([k,d]) => {
    if (!d) return;
    if (Array.isArray(d.on)) { const r = []; d.on.forEach(m => { for (let x = m; x < m + 20; x += B) r.push(x); }); out[k] = { t: d.t || [], r }; }
    else out[k] = { t: Array.isArray(d.t) ? d.t : [], r: Array.isArray(d.r) ? d.r : [] };
  });
  return out;
}
function normalize(s){
  s = s || {};

  periods = periods.slice(0, CFG.maxPeriods);
  let cur = Number(s.cur); if (!(cur >= 0 && cur < periods.length)) cur = periods.length - 1;
  // v30 で自動で作った最初の期間（10/1〜12/31）は、正しい開始日 9/29 に直す
  if (!s.pfix && periods.length === 1 && periods[0].start === "2026-10-01" && periods[0].end === "2026-12-31") periods[0].start = CFG.start;
  return { days: migrateDays(s.days), plan, unit: CFG.units.includes(Number(s.unit)) ? Number(s.unit) : CFG.unit, periods, cur, pfix: 1 };

  }
  const AKEY = KEY + "-auth";
  let ok = false;
  try {
    ok = !!localStorage.getItem(AKEY);
    // この更新の前から使っている人（記録が入っている人）は、そのまま使えるようにする
    if (!ok) {
      let has = false;
      try { const o = JSON.parse(localStorage.getItem(KEY) || "null");
            has = !!o && ((o.entries && Object.keys(o.entries).length > 0) || (o.days && Object.keys(o.days).length > 0)); } catch(e) {}
      if (has) { localStorage.setItem(AKEY, JSON.stringify({ at: "existing" })); ok = true; }
    }
  } catch(e) {}
  if (ok) return;
  const gate = $("gate"); gate.hidden = false; document.body.classList.add("locked");
  const d = new Date();
  // その日（スマホの日付の「日」）のパスワードだけ受け付ける。受付期限を過ぎたら新規登録は終了
  const open = today <= CFG.regEnd ? CFG.codes.filter(c => c.dom === d.getDate()) : [];
  if (!open.length) { $("gErr").textContent = t("gClosed"); $("gPass").disabled = true; $("gBtn").disabled = true; return; }

  const FKEY = KEY + "-fail";

  const lockout = () => { $("gErr").textContent = t("gLimit"); $("gPass").disabled = true; $("gBtn").disabled = true; };
  if (getFail() >= 6) { lockout(); return; }
  const tryPass = () => {
    if (getFail() >= 6) { lockout(); return; }
    const h = fnv("chant:" + $("gPass").value.trim());
    if (!open.some(c => c.hash === h)) {
      try { localStorage.setItem(FKEY, JSON.stringify({ date: today, n: getFail() + 1 })); } catch(e) {}

  document.getElementById("doneMin").textContent = "（" + doneMin + "）";
  const df = document.getElementById("diff");
  // 達成したら月ごとの絵文字（表示している日の月）。超えた分も表示
  const EMO = ["🎽","⛄️","🌸","🌷","🎏","☀️","🏄","🌻","🌕","🌰","🍁","⛷️"];
  const emo = `<span class="emo">${EMO[d.getMonth()]}</span>`;
  df.innerHTML = diff < 0 ? t("left", { n: -diff }) : diff > 0 ? emo + " " + t("over", { n: diff }) : emo;
  df.className = "diff " + (diff < 0 ? "minus" : diff > 0 ? "plus" : "zero");
  document.getElementById("dChants").innerHTML =
    `<small>${cur === today ? t("todayC") : t("thisDayC")}</small>${fmt(countOf(doneMin))} chants ${(doneMin/60).toFixed(1).replace(/\.0$/,"")}h`;
  document.getElementById("dBarFill").style.width = Math.min(100, goalMin ? doneMin/goalMin*100 : 0) + "%";
  // target の個数：目標時間 ÷ 時間単位
  const need = Math.ceil(goalMin / state.unit);
  let picked = 0;
  const now = new Date(), nowM = now.getHours()*60 + now.getMinutes(), isToday = cur === today;
  document.querySelectorAll(".slot").forEach(row => {
    const m = Number(row.dataset.m), bl = blocksOf(m);
    [["t",T],["r",Rr]].forEach(([k,set]) => {
      const c = row.querySelector(".cell."+k), n = bl.filter(x => set.has(x)).length;
      c.classList.toggle("on", n === bl.length); c.classList.toggle("part", n > 0 && n < bl.length);
      c.setAttribute("aria-pressed", n === bl.length);
      if (k === "t" && n === bl.length) picked++;
    });
    row.classList.toggle("now", isToday && nowM >= m && nowM < m + state.unit);
  });
  document.getElementById("tHdr").innerHTML = `target:<b>${need}</b><br><span class="${picked===need?"ok":picked>need?"over":""}">${picked}/${need}</span>`;
}
document.getElementById("list").addEventListener("click", e => {
  const c = e.target.closest(".cell"); if (!c) return;
  const k = c.dataset.k, bl = blocksOf(Number(c.dataset.m));
  const dd = day(), set = new Set(dd[k]);
  const allOn = bl.every(x => set.has(x));
  bl.forEach(x => allOn ? set.delete(x) : set.add(x));
  state.days[cur] = { t: dd.t, r: dd.r, [k]: [...set].sort((a,b)=>a-b) };
  save(); render();
});
// L.W copy：先週の同じ曜日の target（🟡）を、表示中の日にコピー
document.getElementById("copyBtn").addEventListener("click", () => {
  const d = parse(cur); d.setDate(d.getDate() - 7);
  const src = state.days[iso(d)];
  const label = LANG === "ja" ? `${d.getMonth()+1}/${d.getDate()}（${L.wd[wdMon(d)]}）` : `${L.wd[wdMon(d)]} ${d.getMonth()+1}/${d.getDate()}`;
  if (!src || !src.t || !src.t.length) { alert(t("copyNone", { d: label })); return; }
  const dd = day();
  if (dd.t.length && !confirm(t("copyConfirm", { d: label }))) return;
  state.days[cur] = { t: [...src.t], r: dd.r };
  save(); render();
});
function move(n){ const d = parse(cur); d.setDate(d.getDate()+n); const s = iso(d); if (s < CFG.dateMin || s > CFG.dateMax) return; cur = s; render(); }
document.getElementById("prev").addEventListener("click", () => move(-1));
document.getElementById("next").addEventListener("click", () => move(1));
function jumpNow(){
  cur = today; render();
  const el = document.querySelector(".slot.now") || document.querySelector(".slot");
  const top = el.getBoundingClientRect().top + window.scrollY - document.querySelector(".head").offsetHeight - 60;
  window.scrollTo({ top: Math.max(0, top) });
}
document.getElementById("dTodayBtn").addEventListener("click", jumpNow);

// =====================================================================
// Period（期間ごとの target と進み具合。time は Daily の🔵の合計）
// =====================================================================
let DAYS = [];
function makeDays(){
  DAYS = [];
  const d = parse(P().start), e = parse(P().end);
  while (d <= e) { const s = iso(d); DAYS.push([s, wdMon(d), isHoliday(s)]); d.setDate(d.getDate()+1); }
}
const startIn = document.getElementById("start"), endIn = document.getElementById("end");
function changePeriod(){
  const s = startIn.value, e = endIn.value;
  const reset = () => { startIn.value = P().start; endIn.value = P().end; };
  if (!s || !e) return reset();
  if (s > e) { alert(t("badOrder")); return reset(); }
  if (s < CFG.dateMin || e > CFG.dateMax) { alert(t("badRange")); return reset(); }
  if (dayDiff(s,e) + 1 > CFG.maxDays) { alert(t("tooLong")); return reset(); }
  P().start = s; P().end = e; clampTarget(true); save(); buildRows(); refresh();
}
startIn.addEventListener("change", changePeriod);
endIn.addEventListener("change", changePeriod);
// target（プルダウン＋手入力、上限 = min(50,000 × 日数, 5,000,000)）
const tSel = document.getElementById("targetSel");
const targetMax = () => Math.min(CFG.targetMax, CFG.dailyMax * (dayDiff(P().start, P().end) + 1));
function showTarget(){
  const max = targetMax(), tg = P().target;
  const list = CFG.targets.includes(tg) ? CFG.targets : [...CFG.targets, tg].sort((a,b) => a - b);
  tSel.innerHTML = list.map(v => `<option value="${v}" ${v > max ? "disabled" : ""}>${fmt(v)}</option>`).join("") + `<option value="other">${t("other")}</option>`;
  tSel.value = String(tg);
}
function clampTarget(notify){
  const max = targetMax();
  if (P().target > max) { P().target = max; if (notify) alert(t("tclamp", { m: fmt(max) })); }
}
tSel.addEventListener("change", () => {
  if (tSel.value === "other") {
    const max = targetMax();
    const ans = prompt(t("tprompt", { m: fmt(max) }), String(P().target));
    const v = ans == null ? 0 : Number(String(ans).replace(/[^0-9]/g, ""));
    if (v > 0) { if (v > max) alert(t("tmax", { m: fmt(max) })); P().target = Math.min(v, max); save(); refresh(); }
    showTarget(); return;
  }
  P().target = Number(tSel.value); save(); showTarget(); refresh();
});
document.getElementById("pPlan").innerHTML = planSelectsHtml("data-pplan");
document.querySelectorAll("select[data-pplan]").forEach(s => s.addEventListener("change", () => {
  P().plan[s.dataset.pplan] = Number(s.value); save(); refresh();
}));
function syncInputs(){
  startIn.value = P().start; endIn.value = P().end; clampTarget(false); showTarget();
  document.querySelectorAll("select[data-pplan]").forEach(x => x.value = String(P().plan[x.dataset.pplan]));
}
// 表（カレンダー）
const LEGEND = `<span class="legend"><span style="--sw:var(--bg-low)">30%−</span><span style="--sw:var(--bg-b)">10%+</span><span style="--sw:var(--bg-y)">20%+</span><span style="--sw:var(--bg-r)">30%+</span></span>`;
const monthName = mk => LANG === "ja" ? `${Number(mk.slice(0,4))}年${Number(mk.slice(5))}月` : `${L.months[Number(mk.slice(5))-1]} ${mk.slice(0,4)}`;
function buildRows(){
  makeDays();
  let html = "", lastMonth = "";
  DAYS.forEach(([date, wd, hol]) => {
    const mk = date.slice(0,7);
    if (mk !== lastMonth){ lastMonth = mk; html += `<tr class="month"><td colspan="4"><div class="mrow"><span>${monthName(mk)}</span>${LEGEND}</div></td></tr>`; }
    const cls = hol ? "hol" : wd===5 ? "w5" : wd===6 ? "w6" : "";
    html += `<tr class="d ${date===today?"today":""}" id="r${date}" data-date="${date}">
      <td class="${cls}">${md(date)}<span class="dw">${L.wd[wd]}${hol?(LANG==="ja"?"":" ")+L.hol:""}</span></td>
      <td class="tm" id="m${date}"></td><td id="c${date}"></td><td class="tot" id="t${date}"></td></tr>`;
  });
  document.getElementById("rows").innerHTML = html;
}
function refresh(){
  const totalDays = DAYS.length;
  const daily = P().target / Math.max(1, totalDays);
  let total = 0, current = 0;
  DAYS.forEach((d, i) => {
    const date = d[0], m = minOf(date), c = countOf(m);
    total += c; if (date <= today) current = total;
    const mc = document.getElementById("m"+date); mc.textContent = minTxt(m); mc.classList.toggle("z", !m);
    document.getElementById("c"+date).textContent = m ? fmt(c) : "";
    const tc = document.getElementById("t"+date);
    tc.className = "tot";
    if (date <= today) {
      tc.textContent = fmt(total);
      const r = total / (daily * (i+1));
      tc.classList.add(r < 0.7 ? "low" : r > 1.3 ? "or" : r > 1.2 ? "oy" : r > 1.1 ? "ob" : "x");
    } else tc.textContent = "";
  });
  if (today < P().start) current = 0;
  const elapsed = Math.max(0, Math.min(totalDays, dayDiff(P().start, today) + 1));
  const prog = daily * elapsed;
  document.getElementById("elapsedDay").textContent = elapsed;
  document.getElementById("totalDays").textContent = totalDays;
  document.getElementById("countdown").textContent = Math.max(0, totalDays - elapsed) + t("cdUnit");
  document.getElementById("pCurrent").textContent = fmt(current);
  document.getElementById("pProg").textContent = fmt(prog);
  document.getElementById("pDaily").textContent = fmt(daily);
  document.getElementById("pPct").textContent = prog > 0 ? Math.round(current / prog * 100) + "%" : "–";
  const tk = wkKey(today), th = planFor(today)[tk];
  document.getElementById("pTodayGoal").textContent = t("todayGoal", { w: WKL[WKS.indexOf(tk)], h: hTxt(th), c: fmt(countOf(Math.round(th * 60))) });
  setTrack("pTrack", current / P().target * 100);
  document.getElementById("pTfill").style.width = Math.min(100, prog / P().target * 100) + "%";
  document.getElementById("pScaleMax").textContent = fmt(P().target);
  const dates = DAYS.map(d => d[0]);
  document.getElementById("pWk").innerHTML = wkGridHtml(dates, () => P().plan, true);
  document.getElementById("pTc").innerHTML = tcGridHtml(dates);
  renderPeriods();
}
// 日付の行をタップすると、その日の Daily を開く
document.getElementById("rows").addEventListener("click", e => {
  const r = e.target.closest("tr.d"); if (!r) return;
  cur = r.dataset.date; showView("D");
});
function jumpToday(){
  if (!DAYS.length) return;
  const first = DAYS[0][0], last = DAYS[DAYS.length-1][0];
  const s = today < first ? first : today > last ? last : today;
  // 今日の2日前の行が、表の見出しのすぐ下に来るように表示
  const idx = DAYS.findIndex(d => d[0] === s);
  const row = document.getElementById("r" + DAYS[Math.max(0, idx - 2)][0]);
  if (!row) return;
  const thead = document.querySelector("#viewP thead");
  window.scrollTo({ top: Math.max(0, row.getBoundingClientRect().top + window.scrollY - thead.offsetHeight) });
  requestAnimationFrame(() => {
    const gap = row.getBoundingClientRect().top - thead.querySelector("th").getBoundingClientRect().bottom;
    if (Math.abs(gap) > 1) window.scrollBy(0, gap);
  });
}
document.getElementById("pTodayBtn").addEventListener("click", jumpToday);
// 期間の切り替え・追加・削除
function periodSum(p){
  let s = 0;
  for (let d = parse(p.start); iso(d) <= p.end && iso(d) <= today; d.setDate(d.getDate()+1)) s += countOf(minOf(iso(d)));
  return s;
}
function renderPeriods(){
  const sel = document.getElementById("periodSel");
  sel.innerHTML = state.periods.map((p,i) => `<option value="${i}">${t("pno", { n: i + 1 })} ${ymdS(p.start)}〜${ymdS(p.end)}</option>`).join("");
  sel.value = String(state.cur);
  document.getElementById("periodName").textContent = sel.options[sel.selectedIndex] ? sel.options[sel.selectedIndex].textContent : "";
  const p = P(), sum = periodSum(p), pc = p.target ? Math.round(sum / p.target * 100) : 0;
  document.getElementById("pAll").textContent = pc + "%";      // 全体進捗 = 今日までの合計 ÷ 期間の target
}
function switchPeriod(i){ state.cur = i; save(); syncInputs(); buildRows(); refresh(); }
document.getElementById("periodSel").addEventListener("change", e => switchPeriod(Number(e.target.value)));
document.getElementById("addPeriod").addEventListener("click", () => {
  if (state.periods.length >= CFG.maxPeriods) { alert(t("maxP")); return; }
  const last = state.periods.reduce((a,p) => p.end > a.end ? p : a);
  const s = parse(last.end); s.setDate(s.getDate() + 1);
  if (iso(s) > CFG.dateMax) { alert(t("noRoom")); return; }
  const e = new Date(s); e.setDate(e.getDate() + Math.min(CFG.maxDays - 1, Math.max(0, dayDiff(last.start, last.end))));
  const end = iso(e) > CFG.dateMax ? CFG.dateMax : iso(e);
  const np = newPeriod({ start: iso(s), end, target: P().target, plan: {...P().plan} });
  np.target = Math.min(np.target, Math.min(CFG.targetMax, CFG.dailyMax * (dayDiff(np.start, np.end) + 1)));
  state.periods.push(np);
  switchPeriod(state.periods.length - 1);
});
document.getElementById("delPeriod").addEventListener("click", () => {
  if (state.periods.length <= 1) { alert(t("lastP")); return; }
  if (!confirm(t("delConfirm", { n: state.cur + 1 }))) return;
  state.periods.splice(state.cur, 1);
  switchPeriod(Math.min(state.cur, state.periods.length - 1));
});

// =====================================================================
// Summary（年・月の範囲で集計）
// =====================================================================
const sFrom = document.getElementById("sFrom"), sTo = document.getElementById("sTo");
(function(){
  let r = null; try { r = JSON.parse(localStorage.getItem(KEY + "-sr") || "null"); } catch(e) {}
  const ok = v => typeof v === "string" && /^\d{4}-\d{2}-\d{2}$/.test(v);
  if (r && ok(r.from) && ok(r.to)) { sFrom.value = r.from; sTo.value = r.to; }
  else { sFrom.value = P().start; sTo.value = P().end; }       // はじめは表示中の Period と同じ範囲
})();
[sFrom, sTo].forEach(el => el.addEventListener("change", () => {
  try { localStorage.setItem(KEY + "-sr", JSON.stringify({ from: sFrom.value, to: sTo.value })); } catch(e) {}
  renderSummary();
}));
const hS = m => (m / 60).toFixed(1).replace(/\.0$/, "") + "h";
function renderSummary(){
  const $ = id => document.getElementById(id);
  const rs = sFrom.value, re = sTo.value;                          // 日付で指定した範囲
  if (!rs || !re || rs > re) { $("sSpan").textContent = t("yBad"); return; }
  $("sSpan").textContent = ymdS(rs) + " 〜 " + ymdS(re);
  const dates = []; for (let d = parse(rs); iso(d) <= re; d.setDate(d.getDate()+1)) dates.push(iso(d));
  // 実績（chants は今日まで）・実施時間・目標時間・時間帯別
  const ZONES = [["0:00〜5:00", 0, 300], ["5:00〜12:00", 300, 720], ["12:00〜18:00", 720, 1080], ["18:00〜0:00", 1080, 1440]];
  const zone = [0, 0, 0, 0];
  let chants = 0, doneMin = 0, goalMin = 0;
  dates.forEach(date => {
    const m = minOf(date); doneMin += m; if (date <= today) chants += countOf(m);
    goalMin += Math.round(planFor(date)[wkKey(date)] * 60);
    ((state.days[date] && state.days[date].r) || []).forEach(x => { for (let z = 0; z < 4; z++) if (x >= ZONES[z][1] && x < ZONES[z][2]) zone[z] += B; });
  });
  // 期間の target を日数で按分して、範囲内の日数分だけ合計
  let target = 0, prog = 0, listHtml = "";
  state.periods.forEach((p, i) => {
    const a = p.start > rs ? p.start : rs, b = p.end < re ? p.end : re;
    if (a > b) return;
    const per = p.target / (dayDiff(p.start, p.end) + 1);
    target += per * (dayDiff(a, b) + 1);
    const pe = b < today ? b : today;
    if (pe >= a) prog += per * (dayDiff(a, pe) + 1);
    let min = 0, ch = 0;
    for (let d = parse(a); iso(d) <= b; d.setDate(d.getDate()+1)) { const m = minOf(iso(d)); min += m; if (iso(d) <= today) ch += countOf(m); }
    listHtml += `<div class="yitem"><span class="l1 num">${t("pno", { n: i + 1 })}　${ymdS(p.start)}〜${ymdS(p.end)}</span>` +
      `<span class="l2 num">${t("inRange")}${ymdS(a)}〜${ymdS(b)}　<b>${hS(min)}</b>　<b>${fmt(ch)}</b> chants</span></div>`;
  });
  const days = dates.length;
  $("sCurrent").textContent = fmt(chants);
  $("sPct").textContent = target > 0 ? Math.round(chants / target * 100) + "%" : "–";
  $("sDays").textContent = days;
  $("sTarget").textContent = fmt(target);
  $("sProg").textContent = fmt(prog);
  $("sDaily").textContent = fmt(days ? target / days : 0);
  $("sHours").textContent = hS(doneMin); $("sGoalH").textContent = hS(goalMin);
  setTrack("sTrack", target > 0 ? chants / target * 100 : 0);
  $("sTfill").style.width = (target > 0 ? Math.min(100, prog / target * 100) : 0) + "%";
  $("sScaleMax").textContent = fmt(target);
  $("sZones").innerHTML = ZONES.map(z => `<span>${z[0]}</span>`).join("") + zone.map(m => `<b class="${m ? "" : "z"}">${hS(m)}</b>`).join("");
  $("sWk").innerHTML = wkGridHtml(dates, planFor, false);
  $("sTc").innerHTML = tcGridHtml(dates);
}

// =====================================================================
// タブの切り替え
// =====================================================================
let view = "D";
function showView(v){
  view = v;
  ["D","P","S"].forEach(x => {
    document.getElementById("view" + x).hidden = x !== v;
    document.getElementById("tab" + x).classList.toggle("on", x === v);
  });
  if (v === "D") { render(); window.scrollTo({ top: 0 }); }
  if (v === "P") { syncInputs(); buildRows(); refresh(); window.scrollTo({ top: 0 }); }
  if (v === "S") { renderSummary(); window.scrollTo({ top: 0 }); }
}
["D","P","S"].forEach(x => document.getElementById("tab" + x).addEventListener("click", () => showView(x)));

// ---- バックアップ／復元（このアプリ・chant time・chant counter のバックアップを読み込める）----
document.querySelectorAll(".bkBtn").forEach(b => b.addEventListener("click", doBackup));
const fileIn = document.getElementById("importFile");
document.querySelectorAll(".rsBtn").forEach(b => b.addEventListener("click", () => fileIn.click()));
fileIn.addEventListener("change", async () => {
  const f = fileIn.files[0]; if (!f) return;
  try {
    const s = JSON.parse(await f.text());
    if (!s || typeof s !== "object") throw new Error();
    const hasDays = s.days && typeof s.days === "object", hasPeriods = Array.isArray(s.periods) || (s.entries && typeof s.entries === "object");
    if (hasDays && Array.isArray(s.periods)) {                 // このアプリのバックアップ：すべて置き換え
      if (!confirm(t("restoreConfirm"))) return;
      state = normalize(s);
    } else if (hasDays) {                                       // chant time のバックアップ：Daily の記録と設定
      if (!confirm(t("restoreDays"))) return;
      const n = normalize(s); state.days = n.days; state.plan = n.plan; state.unit = n.unit;
    } else if (hasPeriods) {                                    // chant counter のバックアップ：期間の設定だけ
      if (!confirm(t("restorePeriods"))) return;
      const n = normalize(Array.isArray(s.periods) ? s : { periods: [s] });
      state.periods = n.periods; state.cur = n.cur;
    } else throw new Error();
    save(); unitSel.value = String(state.unit); buildList(); showView(view); alert(t("restored"));
  } catch(e) { alert(t("badFile")); }
  fileIn.value = "";
});

// ---- はじめの表示 ----
buildList();
syncInputs();
render();
requestAnimationFrame(() => { if (document.getElementById("gate").hidden) jumpNow(); });

// ---- 日付が変わったとき（開きっぱなし・待機から復帰）に今日を更新 ----
function checkDay(){
  const s = iso(new Date());
  if (s !== today) { if (cur === today) cur = s; today = s; showView(view); }
  else if (view === "D") render();
}
setInterval(checkDay, 60000);

// ---- オフライン対応と自動アップデート ----
let swReg = null;
if ("serviceWorker" in navigator && location.protocol === "https:") {
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register("sw.js").then(r => { swReg = r; }).catch(() => {});
  let reloaded = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (hadController && !reloaded) { reloaded = true; location.reload(); }   // 新しい版に切り替わったら読み込み直す
  });
}
document.addEventListener("visibilitychange", () => {
  if (document.hidden) return;
  checkDay();
  if (swReg) swReg.update().catch(() => {});
});
document.querySelectorAll(".rlBtn").forEach(b => b.addEventListener("click", async () => {
  try { if (swReg) await swReg.update(); } catch(e) {}
  location.reload();
}));

</script>
