<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#EEF1F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141A22" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="chant time">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>chant time</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --paper:#EEF1F4; --sheet:#FFFFFF; --ink:#1D2A3A; --sub:#5F6B7A; --rule:#D5DBE2;
  --done:#1F6FC5; --done-soft:#E3EEFB; --now:#FFF6DA; --minus:#C62828; --plus:#1F6FC5;
  --sat:#2D5EA8; --sun:#B03A3A;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#141A22; --sheet:#1C242F; --ink:#E6EBF1; --sub:#9AA6B4; --rule:#2C3643;
  --done:#5EA2EE; --done-soft:#1D3450; --now:#3A3420; --minus:#F08A8A; --plus:#7FB2F0;
  --sat:#86A9E6; --sun:#EB8C8C;}}
*,*::before,*::after{box-sizing:inherit}
html{-webkit-text-size-adjust:100%;touch-action:manipulation}
button,select,.slot{touch-action:manipulation}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  font-size:15px;line-height:1.45}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:520px;margin:0 auto;padding:0 12px calc(16px + env(safe-area-inset-bottom,0px))}
/* 上部（固定） */
.head{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding:8px 0 8px}
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;overflow:hidden}
.date{display:flex;align-items:center;justify-content:space-between;padding:6px 6px;border-bottom:1px solid var(--rule)}
.date h1{margin:0;font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;font-weight:600;font-size:22px;
  letter-spacing:.02em;text-align:center;flex:1}
.date h1 small{font-size:16px;margin-left:6px}
.date .w5{color:var(--sat)} .date .w6{color:var(--sun)}
.nav{border:0;background:transparent;color:var(--ink);font-size:20px;width:44px;height:40px;border-radius:8px}
.nav:active{background:var(--paper)}
.sum{display:grid;grid-template-columns:4.2em 3.2em 2.2em minmax(0,1fr) auto;align-items:center;gap:0 6px;padding:6px 12px}
.sum > *{padding:3px 0}
.sum .lb{font-weight:700}
.sum .copy{justify-self:end;font:inherit;font-size:13px;font-weight:600;color:#8A6A00;background:#FFF3C4;border:0;border-radius:14px;padding:4px 12px;white-space:nowrap}
.sum .done-row{color:var(--done);font-weight:700}
.sum .urow{grid-column:1 / -1;display:flex;align-items:center;gap:6px}
.sum .urow .lb{margin-right:2px;white-space:nowrap}
.sum .chants{margin-left:auto;text-align:right;font-weight:700;font-size:13px;color:var(--done);white-space:nowrap}
.sum .chants small{font-weight:500;font-size:12px;color:var(--sub)}
.sum .gv{font-size:17px;font-weight:700;text-align:center}
.sum select{font:inherit;font-size:16px;font-weight:700;color:var(--ink);background:var(--paper);
  border:1px solid var(--rule);border-radius:6px;padding:2px 4px;text-align:center;text-align-last:center;
  -webkit-appearance:none;appearance:none;width:3.4em}
.sum .val{font-size:17px;font-weight:700;text-align:center}
.sum .min{text-align:center;color:var(--sub)}
.sum .min.done-row{color:var(--done)}
.sum .diff{font-weight:700;min-width:3.2em;text-align:right;white-space:nowrap}
.sum .diff .emo{font-size:20px;line-height:1;vertical-align:-3px}
.sum .diff.plus,.sum .diff.zero{font-size:14px;letter-spacing:-.02em}
.diff.minus{color:var(--minus)} .diff.plus{color:var(--plus)} .diff.zero{color:var(--sub)}
.bar{height:6px;background:var(--rule)}
.bar i{display:block;height:100%;width:0;background:var(--done);transition:width .3s}
/* 時間の一覧 */
.list{list-style:none;margin:0;padding:0}
.hdr{display:grid;grid-template-columns:1fr 1.2em 1fr 76px 64px;font-size:12px;color:var(--sub);padding:6px 12px 4px;text-align:center;align-items:end}
.hdr b{font-weight:700;color:var(--ink)} .hdr .ok{color:#A07800} .hdr .over{color:var(--minus)}
.slot{display:grid;grid-template-columns:1fr 1.2em 1fr 76px 64px;align-items:stretch;text-align:center;
  width:100%;min-height:44px;padding:0 12px;border-top:1px solid var(--rule);background:var(--sheet);font-size:16px}
.slot > span{align-self:center}
.cell{display:flex;align-items:center;justify-content:center;border:0;background:transparent;padding:0;margin:0;
  cursor:pointer;-webkit-tap-highlight-color:transparent;font:inherit}
.cell:active{background:var(--paper)}
.slot.now{background:var(--now)}

.slot .t{color:var(--sub)}
.dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--sub);opacity:.6}
.cell.on .dot{border:0;opacity:1}
.cell.r.on .dot{background:radial-gradient(circle at 35% 30%,#8CC3FF,var(--done) 60%,#0F4C99)}
.cell.t.on .dot{background:radial-gradient(circle at 35% 30%,#FFF3A6,#F2C300 60%,#B88A00)}
.cell.part .dot{opacity:1;border-style:dashed}
.cell.r.part .dot{border-color:var(--done)} .cell.t.part .dot{border-color:#D9A800}
.cell:focus-visible{outline:2px solid var(--done);outline-offset:-2px}
/* Target time（曜日ごとの目標）*/
.plan-card{padding:8px 10px;margin-top:8px}
.plan-h{font-size:12px;color:var(--sub)}
.plan{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;margin-top:2px}
.plan label{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--sub)}
.plan select{font:inherit;font-size:16px;color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:6px;
  padding:4px 0;width:100%;text-align:center;text-align-last:center;-webkit-appearance:none;appearance:none}
.plan label.today{color:var(--done);font-weight:700}
.plan label.today select{border-color:var(--done)}
/* ボタン：iPhone で位置がずれないよう、画面に固定せず時間割のすぐ上に置く */
.foot{display:flex;gap:8px;justify-content:center;margin:0 0 8px}
.foot button{font:inherit;font-size:14px;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:18px;padding:6px 14px}
.foot button.main{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:600}
/* 初回のパスワード入力画面 */
.gate{position:fixed;inset:0;z-index:100;background:var(--paper);overflow:auto;-webkit-overflow-scrolling:touch;
  padding:calc(20px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px))}
.gbox{max-width:480px;margin:0 auto;background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:16px}
.gbox h2{font-size:18px;margin:0 0 8px}
.gbox ul,.notice ul{margin:0;padding-left:1.2em;font-size:13px;line-height:1.6;color:var(--ink)}
.gbox li,.notice li{margin:4px 0}
.ghint{font-size:12px;color:var(--sub);margin:10px 0}
.glab{display:block;font-size:13px;color:var(--sub);margin-top:10px}
.glab input{display:block;width:100%;margin-top:4px;font:inherit;font-size:16px;color:var(--ink);background:var(--paper);
  border:1px solid var(--rule);border-radius:8px;padding:8px 10px}
#gBtn{display:block;width:100%;margin-top:12px;font:inherit;font-size:16px;font-weight:700;color:#fff;background:#1D2A3A;border:0;border-radius:10px;padding:10px}
#gBtn:disabled{opacity:.4}
.gerr{color:#C62828;font-size:13px;min-height:1.2em;margin:8px 0 0}
body.locked{overflow:hidden}
.notice{max-width:520px;margin:10px auto 0;font-size:12px;color:var(--sub)}
.notice summary{cursor:pointer;text-align:center;color:#E07A10;font-weight:600}
.notice.bk{margin-top:4px}
.notice.bk summary{color:var(--ink)}
.snap{margin:8px 0 0;font-size:12px;color:var(--sub);text-align:center}
.snap button{font:inherit;font-size:13px;margin-left:6px;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:14px;padding:3px 10px}
[hidden]{display:none !important}
/* 使用期限が過ぎたときの画面 */
.expired{position:fixed;inset:0;z-index:110;background:var(--paper);display:flex;align-items:center;justify-content:center;padding:24px}
.expired .gbox{text-align:center}
.expired p{font-size:15px;margin:0 0 8px}
.expired small{display:block;font-size:12px;color:var(--sub);margin-bottom:14px}
.expired button{font:inherit;font-size:16px;font-weight:700;color:#fff;background:#1D2A3A;border:0;border-radius:10px;padding:10px 24px}

.notice ul{color:var(--sub);font-size:12px;margin-top:6px}
.note{font-size:12px;color:var(--sub);text-align:center;margin:12px 0 0}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<div id="expired" class="expired" hidden><div class="gbox"><p id="xMsg"></p><small id="xSub"></small><button id="xBtn" class="xb"></button></div></div>
<div id="gate" class="gate" hidden><div class="gbox">
  <h2 id="gTitle"></h2><ul id="gList"></ul><p class="ghint" id="gHint"></p>
  <label class="glab"><span id="gLabel"></span><input id="gPass" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"></label>
  <button id="gBtn"></button><p class="gerr" id="gErr" role="alert"></p>
</div></div>
<div class="wrap">
  <div class="card plan-card">
    <div class="plan-h">Target time</div>
    <div class="plan" id="plan"></div>
  </div>
  <div class="head">
    <div class="card">
      <div class="date">
        <button class="nav" id="prev" aria-label="前の日">◀</button>
        <h1 class="num" id="dateTitle"></h1>
        <button class="nav" id="next" aria-label="次の日">▶</button>
      </div>
      <div class="sum num">
        <span class="lb">目標</span>
        <span class="gv" id="goalH"></span>
        <span>時間</span>
        <span class="min" id="goalMin"></span>
        <button class="copy" id="copyBtn" aria-label="先週の同じ曜日の target をコピー">L.W copy</button>
        <span class="lb done-row">達成</span>
        <span class="val done-row" id="doneH"></span>
        <span class="done-row">時間</span>
        <span class="min done-row" id="doneMin"></span>
        <span class="diff" id="diff"></span>
        <div class="urow"><span class="lb">時間単位</span><select id="unit" aria-label="時間単位"></select><span>分</span>
        <span class="chants" id="chants"></span></div>
      </div>
      <div class="bar"><i id="barFill"></i></div>
    </div>
  </div>

  <div class="foot">
  <button class="main" id="todayBtn">今日</button>
  <button id="exportBtn">バックアップ</button>
  <button id="importBtn">復元</button>
  <button id="reloadBtn" aria-label="更新">⟳</button>
  <input id="importFile" type="file" accept="application/json,.json" hidden>
  </div>
  <div class="card">
    <div class="hdr num"><span>start</span><span></span><span>end</span><span id="tHdr">target</span><span>real</span></div>
    <div class="list" id="list"></div>
  </div>
  <p class="note">target をタップすると 🟡（予定）、real をタップすると 🔵（実施）になり、もう一度タップで ○ に戻ります。記録はこのスマホの中に保存されます。</p>
  <details class="notice"><summary id="nSum"></summary><ul id="nList"></ul></details>
  <details class="notice bk"><summary id="bSum"></summary><ul id="bList"></ul><div class="snap" id="snapBox"></div></details>
</div>


<script>
const CFG = {"perHour": 3400, "codes": [{"hash": "988aa2be", "dom": 1}, {"hash": "a483f9dd", "dom": 2}, {"hash": "b88657f0", "dom": 3}, {"hash": "c49336c7", "dom": 4}, {"hash": "a0953cb2", "dom": 5}, {"hash": "b48d0d69", "dom": 6}, {"hash": "a090bf84", "dom": 7}, {"hash": "b4750883", "dom": 8}, {"hash": "98771b06", "dom": 9}, {"hash": "26b3df86", "dom": 10}, {"hash": "4ab1d99b", "dom": 11}, {"hash": "56afade8", "dom": 12}, {"hash": "32ad36a5", "dom": 13}, {"hash": "56a99dba", "dom": 14}, {"hash": "32a72677", "dom": 15}, {"hash": "46a5075c", "dom": 16}, {"hash": "2aa29cb1", "dom": 17}, {"hash": "56c7b2ce", "dom": 18}, {"hash": "2ac52ef3", "dom": 19}, {"hash": "ea1ce141", "dom": 20}, {"hash": "c61ee72c", "dom": 21}, {"hash": "ba2112df", "dom": 22}, {"hash": "e62396ba", "dom": 23}, {"hash": "da123ab5", "dom": 24}, {"hash": "be15e038", "dom": 25}, {"hash": "da184ae3", "dom": 26}, {"hash": "be1a5d66", "dom": 27}, {"hash": "da304fc9", "dom": 28}, {"hash": "c6326ee4", "dom": 29}, {"hash": "6d857e3c", "dom": 30}, {"hash": "51831391", "dom": 31}], "regEnd": "2027-11-30", "dateMin": "2026-09-01", "dateMax": "2031-12-31", "useEnd": "2031-12-31", "dayStart": 300, "dayEnd": 1440, "units": [10, 15, 20, 30, 60], "unit": 20, "plan": {"mon": 1, "tue": 1, "wed": 1, "thu": 1, "fri": 1, "sat": 1, "sun": 1, "hol": 1}, "hours": [0.5, 1.0, 1.5, 2.0, 2.5, 3.0, 3.5, 4.0, 4.5, 5.0, 5.5, 6.0, 6.5, 7.0, 7.5, 8.0, 8.5, 9.0, 9.5, 10.0, 11, 12], "version": "20"};
const KEY = "chant-time-v1";

// ---- 更新前の自動の控え：新しい版で初めて開いたとき、保存データを書き換える前に控えを残す ----
(function(){
  try {
    const VKEY = KEY + "-ver", raw = localStorage.getItem(KEY), prev = localStorage.getItem(VKEY);
    if (raw && prev !== CFG.version) {
      const n = new Date(), p = x => String(x).padStart(2, "0");
      const at = n.getFullYear() + "/" + p(n.getMonth()+1) + "/" + p(n.getDate()) + " " + p(n.getHours()) + ":" + p(n.getMinutes());
      localStorage.setItem(KEY + "-snap", JSON.stringify({ at, ts: n.getTime(), data: raw }));
    }
    localStorage.setItem(VKEY, CFG.version);
  } catch(e) {}
})();
const WD = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const PLAN_ITEMS = [["mon","Mon"],["tue","Tue"],["wed","Wed"],["thu","Thu"],["fri","Fri"],["sat","Sat"],["sun","Sun"],["hol","Hol"]];
const B = 5;   // 記録は5分刻みで保存（単位を変えても記録が残るように）

// ---- 保存 ----
// days: { "2026-10-01": { t:[5分ブロックの開始分...], r:[...] } }
let state = { days:{}, plan:{...CFG.plan}, unit: CFG.unit };
try { const s = JSON.parse(localStorage.getItem(KEY)); if (s) state = { ...state, ...s, plan:{...CFG.plan, ...(s.plan||{})} }; } catch(e) {}
function migrate(st){              // 旧版（20分ごとの on）からの変換
  Object.entries(st.days || {}).forEach(([k,d]) => {
    if (d && Array.isArray(d.on)) {
      const r = []; d.on.forEach(m => { for (let x = m; x < m + 20; x += B) r.push(x); });
      st.days[k] = { t: d.t || [], r };
    }
  });
  delete st.goal; return st;
}
state = migrate(state);
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){ alert("保存できませんでした。プライベートブラウズを解除してください。"); } }
// iPhone：プルダウン（ドラム）を閉じた後に画面のずれを元に戻す
document.addEventListener("focusout", e => {
  if (e.target.matches && e.target.matches("select, input")) setTimeout(() => window.scrollTo(window.scrollX, window.scrollY), 50);
});
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});

// ---- 日付 ----
const pad = n => String(n).padStart(2,"0");
const iso = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse = s => new Date(Number(s.slice(0,4)), Number(s.slice(5,7))-1, Number(s.slice(8,10)));
const todayISO = () => iso(new Date());
const GATE = {
  title: "ご利用にあたって",
  items: [
    "このアプリはご招待した方専用です。URLやパスワードの共有、拡散はご遠慮ください。",
    "本アプリは無料で提供しており、動作や計算結果の正確さを保証するものではありません。ご利用はご自身の判断と責任でお願いいたします。",
    "本アプリの利用期間は、2026/9/1からとなります。終了期限は、2026/11/30を予定しています。その後は、予告なく終了する場合があります。",
    "記録はお使いのスマホの中にのみ保存され、外部に送信されることはありません。作成者が記録を見ることはできません。",
    "アプリの削除、Safariの履歴の消去、機種変更などにより、記録が失われることがあります。大切な記録は「バックアップ」で保存してください。",
    "目標を達成したときや月ごとの状況などは、画面のスクリーンショットで記録を残しておくこともできます。",
    "本アプリの内容は、予告なく変更または提供を終了する場合があります。",
    "本アプリの利用により生じた損害について、作成者は責任を負いかねます。",
    "個別のサポートは行っておりません。",
  ],
  hint: "先にSafariの共有ボタンから「ホーム画面に追加」をして、ホーム画面のアイコンから開いたアプリでパスワードを入力してください。",
  label: "パスワード", button: "同意して始める",
  wrong: "パスワードが正しくありません。", closed: "新規登録の受付は終了しました。",
  limit: "パスワード入力制限オーバーです。",
  expired: d => d + " でこのアプリの使用期限が過ぎました。",
  expiredSub: "記録は下のボタンでバックアップとして保存できます。",
  expiredBtn: "バックアップ",
};

// ---- 初回のパスワード入力（受付期限つき）----
(function(){
  const fnv = str => { let h = 0x811c9dc5; for (const b of new TextEncoder().encode(str)) { h ^= b; h = Math.imul(h, 0x01000193) >>> 0; } return h.toString(16).padStart(8, "0"); };
  const $ = id => document.getElementById(id);
  const li = GATE.items.map(t => `<li>${t}</li>`).join("");
  $("gTitle").textContent = GATE.title; $("nSum").textContent = GATE.title;
  $("gList").innerHTML = li; $("nList").innerHTML = li;
  $("gHint").textContent = GATE.hint; $("gLabel").textContent = GATE.label; $("gBtn").textContent = GATE.button;

  // 使用期限（プレ期間の終了日）を過ぎたら、使えない画面を表示（バックアップだけはできる）
  {
    const n = new Date(), t = n.getFullYear() + "-" + String(n.getMonth()+1).padStart(2,"0") + "-" + String(n.getDate()).padStart(2,"0");
    if (t > CFG.useEnd) {
      const x = $("expired"); x.hidden = false; document.body.classList.add("locked");
      $("xMsg").textContent = GATE.expired(CFG.useEnd.replace(/-/g, "/"));
      $("xSub").textContent = GATE.expiredSub; $("xBtn").textContent = GATE.expiredBtn;
      $("xBtn").addEventListener("click", () => { const b = document.getElementById("exportBtn"); if (b) b.click(); });
      return;
    }
  }
  const AKEY = KEY + "-auth";
  let ok = false;
  try {
    ok = !!localStorage.getItem(AKEY);
    // この更新の前から使っている人（記録が入っている人）は、そのまま使えるようにする
    if (!ok) {
      let has = false;
      try { const o = JSON.parse(localStorage.getItem(KEY) || "null");
            has = !!o && ((o.entries && Object.keys(o.entries).length > 0) || (o.days && Object.keys(o.days).length > 0)); } catch(e) {}
      if (has) { localStorage.setItem(AKEY, JSON.stringify({ at: "existing" })); ok = true; }
    }
  } catch(e) {}
  if (ok) return;
  const gate = $("gate"); gate.hidden = false; document.body.classList.add("locked");
  const d = new Date(), today = d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
  // その日（スマホの日付の「日」）のパスワードだけ受け付ける。REG_END を過ぎたら新規登録は終了
  const open = today <= CFG.regEnd ? CFG.codes.filter(c => c.dom === d.getDate()) : [];
  if (!open.length) { $("gErr").textContent = GATE.closed; $("gPass").disabled = true; $("gBtn").disabled = true; return; }
  // 入力ミスの回数（その日のうちに6回まちがえると、7回目から入力できない。翌日にリセット）
  const FKEY = KEY + "-fail";
  const getFail = () => { try { const f = JSON.parse(localStorage.getItem(FKEY) || "null"); return f && f.date === today ? f.n : 0; } catch(e) { return 0; } };
  const lockout = () => { $("gErr").textContent = GATE.limit; $("gPass").disabled = true; $("gBtn").disabled = true; };
  if (getFail() >= 6) { lockout(); return; }
  const tryPass = () => {
    if (getFail() >= 6) { lockout(); return; }
    const h = fnv("chant:" + $("gPass").value.trim());
    if (!open.some(c => c.hash === h)) {
      const n = getFail() + 1;
      try { localStorage.setItem(FKEY, JSON.stringify({ date: today, n })); } catch(e) {}
      $("gErr").textContent = GATE.wrong; return;
    }
    try { localStorage.setItem(AKEY, JSON.stringify({ at: today })); } catch(e) {}
    gate.hidden = true; document.body.classList.remove("locked");
    if (typeof jumpToday === "function") requestAnimationFrame(jumpToday);
    if (typeof jumpNow === "function") requestAnimationFrame(jumpNow);
  };
  $("gBtn").addEventListener("click", tryPass);
  $("gPass").addEventListener("keydown", e => { if (e.key === "Enter") tryPass(); });
})();
const BK = {
  title: "データのバックアップと復元について",
  items: [
    "記録はこのスマホの中にだけ保存されています。アプリの削除、Safariの履歴の消去、機種変更などで記録が失われることがあります。",
    "「バックアップ」を押すと、その時点のすべての記録と設定をファイルに保存できます。ファイルアプリに保存したり、自分宛てにメールやLINEで送ったりしておいてください。",
    "月末やアプリの更新の前など、区切りのときにバックアップを取っておくことをおすすめします。",
    "「復元」をすると、今の記録と設定は、バックアップの内容に丸ごと置き換わります。バックアップを取った日より後に入力した記録は消えます。",
    "復元する前に、今の状態もバックアップしておくと、元に戻せるので安心です。",
    "機種変更のときは、古いスマホでバックアップを取り、新しいスマホで「復元」してください。",
    "アプリが新しい版に更新される直前に、記録の控えを自動で残しています。更新後に記録がおかしくなったときは、下のボタンで更新前の状態に戻せます（更新から7日以内）。",
  ],
  snap: "更新前の控え：", snapBtn: "この状態に戻す",
  snapConfirm: (at, n) => "記録を " + at + "（更新前）の状態に戻します。\n" +
    "この後に入力した記録" + (n > 0 ? "（" + n + "日分）" : "") + "は消えます。\n先に「バックアップ」を取ることをおすすめします。\nよろしいですか？",
  snapNone: "更新前の控えはまだありません。",
  snapOld: "更新前の控えは、更新から7日以内だけ使えます。",
};

// ---- データのバックアップと復元について（説明と、更新前の控えに戻すボタン）----
(function(){
  const $ = id => document.getElementById(id);
  $("bSum").textContent = BK.title;
  $("bList").innerHTML = BK.items.map(t => `<li>${t}</li>`).join("");
  let snap = null;
  try { snap = JSON.parse(localStorage.getItem(KEY + "-snap") || "null"); } catch(e) {}
  const box = $("snapBox");
  if (!snap) { box.textContent = BK.snapNone; return; }
  // 控えの日時（古い控えは表示用の日時から計算）
  const ts = snap.ts || (() => { const m = String(snap.at).match(/(\d+)\/(\d+)\/(\d+) (\d+):(\d+)/);
    return m ? new Date(+m[1], m[2]-1, +m[3], +m[4], +m[5]).getTime() : Date.now(); })();
  const d0 = new Date(ts), now = new Date();
  const days = Math.round((new Date(now.getFullYear(), now.getMonth(), now.getDate()) - new Date(d0.getFullYear(), d0.getMonth(), d0.getDate())) / 86400000);
  if (days > 7) { box.textContent = BK.snapOld; return; }          // 更新から7日を過ぎたらボタンを表示しない
  box.innerHTML = `<span>${BK.snap}${snap.at}</span><button id="snapBtn">${BK.snapBtn}</button>`;
  $("snapBtn").addEventListener("click", () => {
    if (!confirm(BK.snapConfirm(snap.at, days))) return;
    try { localStorage.setItem(KEY, snap.data); } catch(e) {}
    location.reload();
  });
})();
let cur = todayISO();
const day = () => state.days[cur] || { t:[], r:[] };
const hm = m => (m % 1440 === 0 && m > 0 ? 0 : Math.floor(m/60)) + ":" + pad(m % 60);

// ---- 日本の祝日（自動計算）----
const holCache = {};
function holidaysOf(y){
  if (holCache[y]) return holCache[y];
  const h = {};
  const add = (m,d) => { h[y+"-"+pad(m)+"-"+pad(d)] = 1; };
  const nthMon = (m,n) => { const f = new Date(y,m-1,1).getDay(); return 1 + ((8-f)%7) + (n-1)*7; };
  add(1,1); add(1,nthMon(1,2)); add(2,11); add(2,23);
  add(3,Math.floor(20.8431+0.242194*(y-1980)-Math.floor((y-1980)/4)));
  add(4,29); add(5,3); add(5,4); add(5,5); add(7,nthMon(7,3)); add(8,11); add(9,nthMon(9,3));
  add(9,Math.floor(23.2488+0.242194*(y-1980)-Math.floor((y-1980)/4)));
  add(10,nthMon(10,2)); add(11,3); add(11,23);
  Object.keys(h).forEach(k => { const d = parse(k); d.setDate(d.getDate()+2);
    if (h[iso(d)]) { const mid = parse(k); mid.setDate(mid.getDate()+1);
      if (!h[iso(mid)] && mid.getDay() !== 0) h[iso(mid)] = 1; } });
  Object.keys(h).sort().forEach(k => { const d = parse(k); if (d.getDay() === 0) {
    do { d.setDate(d.getDate()+1); } while (h[iso(d)]); h[iso(d)] = 1; } });
  return holCache[y] = h;
}
const isHoliday = s => !!holidaysOf(Number(s.slice(0,4)))[s];
const planKeyOf = s => isHoliday(s) ? "hol" : ["mon","tue","wed","thu","fri","sat","sun"][(parse(s).getDay()+6)%7];

// ---- Target time（曜日ごと）----
document.getElementById("plan").innerHTML = PLAN_ITEMS.map(([k,l]) =>
  `<label data-k="${k}">${l}<select data-plan="${k}" aria-label="${l} の目標時間">${CFG.hours.map(h=>`<option value="${h}">${String(h).replace(/\.0$/,"")}h</option>`).join("")}</select></label>`).join("");
document.querySelectorAll("select[data-plan]").forEach(sel => {
  sel.value = String(state.plan[sel.dataset.plan]);
  sel.addEventListener("change", () => { state.plan[sel.dataset.plan] = Number(sel.value); save(); render(); });
});

// ---- 時間単位 ----
const unitSel = document.getElementById("unit");
unitSel.innerHTML = CFG.units.map(u => `<option value="${u}">${u}</option>`).join("");
unitSel.value = String(state.unit);
unitSel.addEventListener("change", () => { state.unit = Number(unitSel.value); save(); buildList(); render(); });

// ---- 時間割 ----
let SLOTS = [];
function buildList(){
  const u = state.unit; SLOTS = [];
  for (let m = CFG.dayStart; m < CFG.dayEnd; m += u) SLOTS.push(m);
  document.getElementById("list").innerHTML = SLOTS.map(m =>
    `<div class="slot num" data-m="${m}"><span>${hm(m)}</span><span class="t">~</span><span>${hm(Math.min(m+u, CFG.dayEnd))}</span>`+
    `<button class="cell t" data-k="t" data-m="${m}" aria-label="${hm(m)} target"><span class="dot"></span></button>`+
    `<button class="cell r" data-k="r" data-m="${m}" aria-label="${hm(m)} real"><span class="dot"></span></button></div>`).join("");
}
const blocksOf = m => { const a = []; for (let x = m; x < Math.min(m + state.unit, CFG.dayEnd); x += B) a.push(x); return a; };

function render(){
  const d = parse(cur), wd = (d.getDay()+6)%7, hol = isHoliday(cur);
  document.getElementById("dateTitle").innerHTML =
    `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())}<small class="${hol||wd===6?"w6":wd===5?"w5":""}">${WD[wd]}${hol?" Hol":""}</small>`;
  const pk = planKeyOf(cur);
  document.querySelectorAll(".plan label").forEach(l => l.classList.toggle("today", l.dataset.k === pk));
  const goalH = state.plan[pk], goalMin = Math.round(goalH * 60);
  const dd = day(), T = new Set(dd.t), Rr = new Set(dd.r);
  const doneMin = Rr.size * B;
  const diff = doneMin - goalMin;
  document.getElementById("goalH").textContent = goalH.toFixed(1);
  document.getElementById("goalMin").textContent = "（" + goalMin + "）";
  document.getElementById("doneH").textContent = (doneMin/60).toFixed(1);
  document.getElementById("doneMin").textContent = "（" + doneMin + "）";
  const df = document.getElementById("diff");
  // 達成したら月ごとの絵文字（表示している日の月）。超えた分も表示
  const EMO = ["🎽","⛄️","🌸","🌷","🎏","☀️","🏄","🌻","🌕","🌰","🍁","⛷️"];
  const emo = `<span class="emo">${EMO[d.getMonth()]}</span>`;
  df.innerHTML = diff < 0 ? "あと" + (-diff) + "分" : diff > 0 ? emo + " +" + diff + "分😁" : emo;   // ちょうど達成は絵文字だけ
  df.className = "diff " + (diff < 0 ? "minus" : diff > 0 ? "plus" : "zero");
  // 実施時間 × 3,400回/1時間
  document.getElementById("chants").innerHTML =
    `<small>${cur === todayISO() ? "本日" : "この日"}：</small>${Math.round(doneMin/60*CFG.perHour).toLocaleString("ja-JP")} chants ${(doneMin/60).toFixed(1).replace(/\.0$/,"")}h`;
  document.getElementById("barFill").style.width = Math.min(100, goalMin ? doneMin/goalMin*100 : 0) + "%";

  // target の個数：目標時間 ÷ 時間単位
  const need = Math.ceil(goalMin / state.unit);
  let picked = 0;
  const now = new Date(), nowM = now.getHours()*60 + now.getMinutes(), isToday = cur === todayISO();
  document.querySelectorAll(".slot").forEach(row => {
    const m = Number(row.dataset.m), bl = blocksOf(m);
    [["t",T],["r",Rr]].forEach(([k,set]) => {
      const c = row.querySelector(".cell."+k), n = bl.filter(x => set.has(x)).length;
      c.classList.toggle("on", n === bl.length); c.classList.toggle("part", n > 0 && n < bl.length);
      c.setAttribute("aria-pressed", n === bl.length);
      if (k === "t" && n === bl.length) picked++;
    });
    row.classList.toggle("now", isToday && nowM >= m && nowM < m + state.unit);
  });
  const th = document.getElementById("tHdr");
  th.innerHTML = `target:<b>${need}</b><br><span class="${picked===need?"ok":picked>need?"over":""}">${picked}/${need}</span>`;
}

// ---- 操作 ----
document.getElementById("list").addEventListener("click", e => {
  const c = e.target.closest(".cell"); if (!c) return;
  const k = c.dataset.k, bl = blocksOf(Number(c.dataset.m));
  const dd = day(), set = new Set(dd[k]);
  const allOn = bl.every(x => set.has(x));
  bl.forEach(x => allOn ? set.delete(x) : set.add(x));
  state.days[cur] = { t: dd.t, r: dd.r, [k]: [...set].sort((a,b)=>a-b) };
  save(); render();
});
// ---- copy：先週の同じ曜日の target（🟡）を、表示中の日にコピー ----
document.getElementById("copyBtn").addEventListener("click", () => {
  const d = parse(cur); d.setDate(d.getDate() - 7);
  const src = state.days[iso(d)], wd = ["月","火","水","木","金","土","日"][(d.getDay()+6)%7];
  const label = `${d.getMonth()+1}/${d.getDate()}（${wd}）`;
  if (!src || !src.t || !src.t.length) { alert(`先週の ${label} には target（🟡）がありません。`); return; }
  const dd = day();
  if (dd.t.length && !confirm(`今の target（🟡）を、先週の ${label} の内容に置き換えます。よろしいですか？`)) return;
  state.days[cur] = { t: [...src.t], r: dd.r };
  save(); render();
});
function move(n){ const d = parse(cur); d.setDate(d.getDate()+n); const t = iso(d); if (t < CFG.dateMin || t > CFG.dateMax) return; cur = t; render(); }
document.getElementById("prev").addEventListener("click", () => move(-1));
document.getElementById("next").addEventListener("click", () => move(1));
function jumpNow(){
  cur = todayISO(); render();
  const el = document.querySelector(".slot.now") || document.querySelector(".slot");
  const top = el.getBoundingClientRect().top + window.scrollY - document.querySelector(".head").offsetHeight - 60;
  window.scrollTo({ top: Math.max(0, top) });
}
document.getElementById("todayBtn").addEventListener("click", jumpNow);
setInterval(render, 60000);

// ---- バックアップ／復元 ----
document.getElementById("exportBtn").addEventListener("click", async () => {
  const name = "chant_time_backup_" + todayISO() + ".json";
  const file = new File([JSON.stringify(state)], name, {type:"application/json"});
  if (navigator.canShare && navigator.canShare({files:[file]})) {
    try { await navigator.share({files:[file], title:name}); return; } catch(e) { if (e.name === "AbortError") return; }
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
});
const fileIn = document.getElementById("importFile");
document.getElementById("importBtn").addEventListener("click", () => fileIn.click());
fileIn.addEventListener("change", async () => {
  const f = fileIn.files[0]; if (!f) return;
  try {
    const s = JSON.parse(await f.text());
    if (!s || typeof s.days !== "object") throw new Error();
    if (!confirm("バックアップの内容で、今の記録と設定をすべて置き換えます。バックアップを取った日より後に入力した記録は消えます。必要な場合は「キャンセル」を押して、先に今の状態をバックアップしてください。復元してよろしいですか？")) return;
    state = migrate({ days: s.days, plan: {...CFG.plan, ...(s.plan||{})}, unit: s.unit || CFG.unit });
    save(); unitSel.value = String(state.unit);
    document.querySelectorAll("select[data-plan]").forEach(x => x.value = String(state.plan[x.dataset.plan]));
    buildList(); render(); alert("復元しました。");
  } catch(e) { alert("このファイルは読み込めません。chant time のバックアップ（.json）を選んでください。"); }
  fileIn.value = "";
});

buildList();
render();
requestAnimationFrame(jumpNow);
// ---- オフライン対応と自動アップデート ----
let swReg = null;
if ("serviceWorker" in navigator && location.protocol === "https:") {
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register("sw.js").then(r => { swReg = r; }).catch(() => {});
  let reloaded = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (hadController && !reloaded) { reloaded = true; location.reload(); }   // 新しい版に切り替わったら読み込み直す
  });
}
document.addEventListener("visibilitychange", () => {
  if (document.hidden) return;
  render();
  if (swReg) swReg.update().catch(() => {});                                  // 新しい版がないか確認
});
document.getElementById("reloadBtn").addEventListener("click", async () => {
  try { if (swReg) await swReg.update(); } catch(e) {}
  location.reload();
});
</script>
